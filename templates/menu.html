<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OhYeah — Chat émotionnel</title>
    <link rel="stylesheet" href="style.css">
<style>* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1c1f2b, #0b0d14);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.menu-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.menu-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
    animation: fadeIn 0.6s ease;
}

.logo {
    font-size: 42px;
    margin-bottom: 10px;
}

.logo span {
    color: #ff5fa2;
}

.subtitle {
    opacity: 0.8;
    margin-bottom: 30px;
}

select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 16px;
    outline: none;
}

.emotion-counters {
    margin: 25px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 14px;
    opacity: 0.9;
}

.emotion-counters span {
    font-weight: bold;
}

button {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #ff5fa2, #ff8fd8);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,95,162,0.5);
}

.global-counter {
    margin-top: 25px;
    opacity: 0.6;
    font-size: 14px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="menu-container">

    <div class="menu-card">

        <h1 class="logo">Oh<span>Yeah</span></h1>
        <p class="subtitle">Discute avec quelqu’un qui ressent la même chose que toi</p>

        <!-- Sélecteur émotion -->
        <div class="emotion-select">
            <select id="emotion">
                <option value="">Choisis une émotion</option>
                <option value="heureux">😊 Heureux</option>
                <option value="triste">😢 Triste</option>
                <option value="enerve">😡 Énervé</option>
                <option value="calme">😌 Calme</option>
                <option value="amour">❤️ Amour</option>
            </select>
        </div>

        <!-- Compteurs émotions -->
        <div class="emotion-counters">
            <div>😊 Heureux <span id="count-heureux">0</span></div>
            <div>😢 Triste <span id="count-triste">0</span></div>
            <div>😡 Énervé <span id="count-enerve">0</span></div>
            <div>😌 Calme <span id="count-calme">0</span></div>
            <div>❤️ Amour <span id="count-amour">0</span></div>
        </div>

        <!-- Bouton -->
        <button id="startChat">Lancer une discussion</button>

    </div>

    <!-- Compteur global -->
    <div class="global-counter">
        🌍 <span id="globalCount">0</span> utilisateurs connectés
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="menu.js">const socket = io();

socket.on("global_count", count => {
    document.getElementById("globalCount").textContent = count;
});

socket.on("emotion_counts", data => {
    for (let emo in data) {
        const el = document.getElementById("count-" + emo);
        if (el) el.textContent = data[emo];
    }
});

document.getElementById("startChat").onclick = () => {
    const emotion = document.getElementById("emotion").value;
    if (!emotion) return alert("Choisis une émotion");

    window.location.href = `/chat?emotion=${emotion}`;
};
</script>
</body>
</html>
