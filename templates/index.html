<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oh Yeah</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }
        #chat {
            display: none;
        }
        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            margin-bottom: 10px;
        }
        input, select, button {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>
<body>

<h1>Oh Yeah</h1>

<div id="login">
    <input id="pseudo" placeholder="Ton pseudo"><br>
    <select id="emotion">
        <option value="😊">Heureux</option>
        <option value="😢">Triste</option>
        <option value="😡">Énervé</option>
        <option value="😐">Neutre</option>
    </select><br>
    <button onclick="join()">Rejoindre</button>
</div>

<div id="waiting" style="display:none;">
    <p>En attente d’un autre utilisateur...</p>
</div>

<div id="chat">
    <h3 id="roomEmotion"></h3>
    <div id="messages"></div>
    <input id="msg" placeholder="Message">
    <button onclick="send()">Envoyer</button>
</div>

<script>
const socket = io();
let room = "";
let emotion = "";
let pseudo = "";

function join() {
    pseudo = document.getElementById("pseudo").value;
    emotion = document.getElementById("emotion").value;

    socket.emit("join", {
        sid: socket.id,
        pseudo: pseudo,
        emotion: emotion
    });

    document.getElementById("login").style.display = "none";
    document.getElementById("waiting").style.display = "block";
}

socket.on("waiting", () => {
    console.log("En attente...");
});

socket.on("joined", data => {
    room = data.room;
    emotion = data.emotion;

    document.getElementById("waiting").style.display = "none";
    document.getElementById("chat").style.display = "block";
    document.getElementById("roomEmotion").innerText = "Salon " + emotion;
});

function send() {
    const text = document.getElementById("msg").value;
    if (!text) return;

    socket.emit("message", {
        room: room,
        pseudo: pseudo,
        text: text,
        emotion: emotion
    });

    document.getElementById("msg").value = "";
}

socket.on("message", data => {
    const div = document.createElement("div");
    div.innerText = `${data.emotion} ${data.pseudo} : ${data.text}`;
    document.getElementById("messages").appendChild(div);
});
</script>

</body>
</html>
