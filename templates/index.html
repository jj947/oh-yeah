<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oh Yeah</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="menu-page">

    <div class="menu-card">
        <h1>🔥 Oh Yeah</h1>

        <p class="counter">
            👥 Utilisateurs en ligne :
            <span id="globalCount">0</span>
        </p>

        <input id="username" placeholder="Ton pseudo">

        <select id="emotion">
            <option value="">Choisis une émotion</option>
            <option value="heureux">😊 Heureux</option>
            <option value="triste">😢 Triste</option>
            <option value="enerve">😡 Énervé</option>
            <option value="calme">😌 Calme</option>
            <option value="amour">❤️ Amour</option>
        </select>

        <button onclick="goChat()">Entrer</button>
    </div>


    <script src="/static/menu.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io();

    socket.on("global_count", (count) => {
        document.getElementById("globalCount").innerText = count;
    });
</script>
</body>
</html>
