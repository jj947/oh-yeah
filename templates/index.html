<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oh Yeah</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 420px;
            height: 90vh;
            background: #111;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        header {
            padding: 16px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            background: #181818;
            border-bottom: 1px solid #222;
        }

        /* ----------- MENU ----------- */

        #menu {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        input, select {
            background: #1f1f1f;
            color: white;
        }

        button {
            background: #6a5cff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #5848e5;
        }

        #status {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        /* ----------- CHAT ----------- */

        #chat {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
        }

        .me {
            align-self: flex-end;
            background: #6a5cff;
        }

        .other {
            align-self: flex-start;
            background: #2a2a2a;
        }

        .system {
            align-self: center;
            font-size: 12px;
            color: #aaa;
        }

        /* ----------- BARRE MESSAGE ----------- */

        .input-bar {
            display: flex;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid #222;
            background: #181818;
        }

        .input-bar textarea {
            flex: 1;
            resize: none;
            height: 42px;              /* 👈 hauteur fixe */
            max-height: 42px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            background: #1f1f1f;
            color: white;
            overflow-y: auto;          /* 👈 scroll interne */
        }

        .input-bar button {
            width: 48px;               /* 👈 bouton petit */
            height: 42px;
            border-radius: 10px;
            font-size: 18px;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="app">
    <header>Oh Yeah</header>

    <!-- MENU -->
    <div id="menu">
        <input id="username" placeholder="Ton pseudo">
        <select id="emotion">
            <option value="">Choisis une émotion</option>
            <option value="joie">😊 Joie</option>
            <option value="triste">😢 Triste</option>
            <option value="colere">😡 Colère</option>
            <option value="stress">😰 Stress</option>
        </select>
        <button onclick="join()">Rejoindre</button>
        <div id="status"></div>
    </div>

    <!-- CHAT -->
    <div id="chat">
        <div id="messages"></div>

        <div class="input-bar">
            <textarea id="message" placeholder="Écris ton message..."></textarea>
            <button onclick="send()">➤</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let username = "";

    function join() {
        username = document.getElementById("username").value.trim();
        const emotion = document.getElementById("emotion").value;

        if (!username || !emotion) {
            alert("Pseudo et émotion obligatoires");
            return;
        }

        socket.emit("join", { username, emotion });
    }

    function send() {
        const input = document.getElementById("message");
        const text = input.value.trim();
        if (!text) return;

        socket.emit("message", { message: text });
        addMessage(username + " : " + text, "me");
        input.value = "";
    }

    function addMessage(text, cls) {
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.textContent = text;
        document.getElementById("messages").appendChild(div);
        div.scrollIntoView();
    }

    socket.on("status", msg => {
        document.getElementById("status").textContent = msg;

        if (msg.includes("Partenaire trouvé")) {
            document.getElementById("menu").style.display = "none";
            document.getElementById("chat").style.display = "flex";
            addMessage(msg, "system");
        } else {
            addMessage(msg, "system");
        }
    });

    socket.on("message", data => {
        addMessage(data.from + " : " + data.message, "other");
    });
</script>

</body>
</html>
