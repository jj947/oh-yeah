<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Oh Yeah</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#app {
    width: 360px;
    background: rgba(0,0,0,0.35);
    border-radius: 15px;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

#global {
    text-align: center;
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 15px;
}

select, input, button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    font-size: 16px;
}

button {
    background: #ff5f6d;
    color: white;
    cursor: pointer;
}

#chat {
    display: none;
    margin-top: 15px;
}

#messages {
    height: 200px;
    overflow-y: auto;
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
}

.msg {
    margin-bottom: 6px;
}

.status {
    text-align: center;
    font-size: 14px;
    opacity: 0.9;
    margin: 8px 0;
}

#sendBox {
    display: flex;
    gap: 5px;
    margin-top: 10px;
}

#sendBox input {
    flex: 1;
}

#sendBox button {
    width: 80px;
}
</style>
</head>

<body>
<div id="app">

<h1>Oh Yeah</h1>
<div id="global">👥 En attente : 0</div>

<div id="menu">
    <input id="username" placeholder="Ton pseudo">
    <select id="emotion">
        <option value="">Choisis une émotion</option>
        <option value="heureux" id="count-heureux" data-base="😊 Heureux">😊 Heureux</option>
        <option value="triste" id="count-triste" data-base="😢 Triste">😢 Triste</option>
        <option value="enerve" id="count-enerve" data-base="😡 Énervé">😡 Énervé</option>
        <option value="calme" id="count-calme" data-base="😌 Calme">😌 Calme</option>
        <option value="amour" id="count-amour" data-base="❤️ Amour">❤️ Amour</option>
    </select>
    <button onclick="join()">Rejoindre</button>
</div>

<div id="chat">
    <div class="status" id="status"></div>
    <div id="messages"></div>

    <div id="sendBox">
        <input id="msg" placeholder="Écris ton message">
        <button onclick="send()">Envoyer</button>
    </div>

    <button onclick="leave()">Retour au salon</button>
</div>

</div>

<script>
const socket = io();

function join() {
    const u = username.value.trim();
    const e = emotion.value;
    if (!u || !e) return;

    socket.emit("join", {username: u, emotion: e});
    menu.style.display = "none";
    chat.style.display = "block";
}

function send() {
    const text = msg.value.trim();
    if (!text) return;
    socket.emit("send_message", {message: text});
    msg.value = "";
}

function leave() {
    socket.emit("leave");
    chat.style.display = "none";
    menu.style.display = "block";
    messages.innerHTML = "";
}

socket.on("status", s => {
    status.textContent = s;
});

socket.on("message", data => {
    const div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<b>${data.from}</b> : ${data.message}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
});

socket.on("emotion_counts", counts => {
    for (const emo in counts) {
        const el = document.getElementById("count-" + emo);
        if (!el) continue;
        el.textContent = `${el.dataset.base} (${counts[emo]})`;
    }
});

socket.on("global_count", n => {
    document.getElementById("global").textContent = `👥 En attente : ${n}`;
});
</script>

</body>
</html>
