<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chat Émotion</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eceff1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 400px;
    height: 600px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
}

header {
    background: #5e60ce;
    color: white;
    padding: 12px;
    text-align: center;
}

#menu, #chat {
    flex: 1;
    padding: 16px;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #5e60ce;
    color: white;
    border: none;
    cursor: pointer;
}

#chat {
    display: none;
    flex-direction: column;
}

#status {
    text-align: center;
    font-size: 14px;
    margin-bottom: 6px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    background: #f5f5f5;
    padding: 10px;
}

.msg {
    max-width: 70%;
    padding: 8px 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    font-size: 14px;
}

.me {
    background: #5e60ce;
    color: white;
    margin-left: auto;
}

.other {
    background: #e0e0e0;
    margin-right: auto;
}

#inputBar {
    display: flex;
    gap: 6px;
}

#inputBar input {
    flex: 1;
}

#back {
    margin-top: 8px;
    background: #e63946;
}
</style>
</head>

<body>
<div id="app">
<header>
    <h3>Chat par émotion</h3>
    <div id="global">0 en ligne</div>
</header>

<div id="menu">
    <input id="username" placeholder="Pseudo">
    <select id="emotion">
        <option value="">Choisis une émotion</option>
        <option value="heureux">😊 Heureux</option>
        <option value="triste">😢 Triste</option>
        <option value="enerve">😡 Énervé</option>
        <option value="calme">😌 Calme</option>
        <option value="amour">❤️ Amour</option>
    </select>
    <button onclick="join()">Entrer</button>
</div>

<div id="chat">
    <div id="status"></div>
    <div id="messages"></div>

    <div id="inputBar">
        <input id="msg" placeholder="Message...">
        <button onclick="send()">Envoyer</button>
    </div>

    <button id="back" onclick="leave()">Retour</button>
</div>
</div>

<script>
const socket = io();

function join() {
    socket.emit("join", {
        username: username.value,
        emotion: emotion.value
    });
}

socket.on("joined_chat", () => {
    menu.style.display = "none";
    chat.style.display = "flex";
});

function send() {
    if (msg.value.trim()) {
        socket.emit("send_message", { message: msg.value });
        msg.value = "";
    }
}

socket.on("message", data => {
    const d = document.createElement("div");
    d.className = "msg " + (data.self ? "me" : "other");
    d.textContent = data.text;
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
});

socket.on("status", txt => status.textContent = txt);

socket.on("counters", data => {
    global.textContent = data.global + " en ligne";
});

function leave() {
    socket.emit("leave");
    chat.style.display = "none";
    menu.style.display = "block";
    messages.innerHTML = "";
}
</script>
</body>
</html>
