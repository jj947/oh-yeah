<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Émotion Chat</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1e1e2f, #2a2a40);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
}

#app {
    width: 380px;
    height: 620px;
    background: #12121c;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    color: white;
}

header {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #2c2c3a;
}

header h1 {
    margin: 0;
    font-size: 20px;
}

#global {
    font-size: 13px;
    opacity: 0.7;
}

section {
    flex: 1;
    padding: 16px;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

input, select {
    background: #1e1e2f;
    color: white;
}

button {
    background: #6c63ff;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #5a52e0;
}

#chat {
    display: none;
    flex-direction: column;
    height: 100%;
}


#status {
    text-align: center;
    font-size: 14px;
    margin-bottom: 8px;
    opacity: 0.85;
}

#messages {
    flex: 1;                   /* prend l’espace dispo */
    background: #181825;
    border-radius: 12px;
    padding: 10px;
    overflow-y: auto;          /* SCROLL vertical */
    min-height: 0;             /* TRÈS IMPORTANT */
}


.msg {
    max-width: 75%;
    padding: 10px 14px;
    margin-bottom: 8px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
}

.me {
    background: #6c63ff;
    margin-left: auto;
}

.other {
    background: #2c2c3a;
}

    
#inputBar {
    flex-shrink: 0;
}

#inputBar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

#inputBar input {
    flex: 1;
}

    #inputBar textarea {
    resize: none;          /* empêche l'agrandissement manuel */
    background: #1e1e2f;
    color: white;
    border-radius: 12px;
    padding: 10px;
    font-size: 14px;
    height: 60px;          /* HAUTEUR FIXE */
    overflow-y: auto;
}

#leave {
    margin-top: 10px;
    background: #e63946;
}
</style>
</head>

<body>

<div id="app">
<header>
    <h1>Chat par émotion</h1>
    <div id="global">0 en ligne</div>
</header>

<section id="menu">
    <select id="emotion">
        <option value="">Choisis une émotion</option>
        <option value="heureux">😊 Heureux</option>
        <option value="triste">😢 Triste</option>
        <option value="enerve">😡 Énervé</option>
        <option value="calme">😌 Calme</option>
        <option value="amour">❤️ Amour</option>
    </select>
    <button onclick="join()">Entrer</button>
</section>

<section id="chat">
    <div id="status"></div>
    <div id="messages"></div>

    <div id="inputBar">
    <textarea id="msg" rows="3" placeholder="Écris ton message..."></textarea>
    <button onclick="send()">Envoyer</button>
</div>


    <button id="leave" onclick="leave()">Retour au menu</button>
</section>
</div>

<script>
const socket = io();

function join() {
    socket.emit("join", { emotion: emotion.value });
}

socket.on("enter_chat", () => {
    menu.style.display = "none";
    chat.style.display = "flex";
});

function send() {
    if (msg.value.trim()) {
        socket.emit("send_message", { message: msg.value });
        msg.value = "";
    }
}

socket.on("message", data => {
    const div = document.createElement("div");
    div.className = "msg " + (data.self ? "me" : "other");
    div.textContent = data.text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
});

socket.on("status", text => {
    status.textContent = text;
});

socket.on("global_count", n => {
    global.textContent = n + " en ligne";
});

function leave() {
    socket.emit("leave");
}

socket.on("return_menu", () => {
    chat.style.display = "none";
    menu.style.display = "block";
    messages.innerHTML = "";
    status.textContent = "";
});
</script>

</body>
</html>
