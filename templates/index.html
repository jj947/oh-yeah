<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OhYeah Chat</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

body {
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at top, #111827, #0f172a);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* TOP BAR */
.top {
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:10px 20px;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}

.card {
    width:380px;
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:15px;
}

/* INPUT */
input, select, button {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    border:none;
}

button {
    background:#22c55e;
    cursor:pointer;
    font-weight:bold;
}

/* CHAT */
#chat { display:none; }

#messages {
    height:260px;
    overflow-y:auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
}

.msg { margin:5px 0; }

.me { color:#22c55e; }

.status {
    text-align:center;
    opacity:0.8;
    font-style:italic;
}

.badge {
    font-size:12px;
    opacity:0.7;
}

/* animation */
@keyframes pulse {
    0% { opacity:0.5; }
    50% { opacity:1; }
    100% { opacity:0.5; }
}

.waiting {
    animation: pulse 1.5s infinite;
    text-align:center;
}

</style>
</head>

<body>

<div class="top">
    <div id="counter">0 connectés</div>
</div>

<div class="card">

<!-- MENU -->
<div id="menu">
    <h2>OhYeah 💬</h2>

    <input id="username" placeholder="Pseudo">

    <select id="emotion">
        <option value="">Émotion</option>
        <option value="heureux">😊 heureux</option>
        <option value="triste">😢 triste</option>
        <option value="enerve">😡 énervé</option>
        <option value="calme">😌 calme</option>
        <option value="amour">❤️ amour</option>
    </select>

    <button onclick="join()">Rejoindre</button>
</div>

<!-- CHAT -->
<div id="chat">

    <div id="status" class="waiting">en attente d'un partenaire...</div>

    <div id="messages"></div>

    <input id="msg" placeholder="message...">
    <button onclick="send()">envoyer</button>
</div>

</div>

<script>

const socket = io(window.location.origin, {
    transports: ["websocket", "polling"]
});

let username = "";
let emotion = "";

/* JOIN */
function join() {
    username = document.getElementById("username").value;
    emotion = document.getElementById("emotion").value;

    if(!username || !emotion) return alert("complète tout");

    socket.emit("join", {username, emotion});

    document.getElementById("menu").style.display="none";
    document.getElementById("chat").style.display="block";
}

/* SEND */
function send() {
    let m = document.getElementById("msg").value;
    if(!m) return;

    socket.emit("message",{message:m});

    add(username,m,true);
    document.getElementById("msg").value="";
}

/* ADD MSG */
function add(user,msg,me=false){
    let div=document.createElement("div");
    div.className="msg";
    div.innerHTML=`<b class="${me?'me':''}">${user} (${emotion})</b> : ${msg}`;
    document.getElementById("messages").appendChild(div);
}

/* SOCKET EVENTS */
socket.on("status", t=>{
    document.getElementById("status").innerText=t;
});

socket.on("message", d=>{
    add(d.from, d.message);
});

socket.on("count", n=>{
    document.getElementById("counter").innerText=n+" connectés";
});

</script>

</body>
</html>
