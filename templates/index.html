<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oh Yeah</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        #box {
            max-width: 400px;
            margin: 40px auto;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
        }
        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            border: none;
        }
        #chat {
            display: none;
        }
        #messages {
            height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: left;
        }
        .status {
            color: yellow;
            font-size: 14px;
            margin: 5px;
        }
    </style>
</head>
<body>

<div id="box">
    <h1>Oh Yeah 😎</h1>

    <div id="login">
        <input id="username" placeholder="Ton pseudo">
        <select id="emotion">
            <option value="joyeux">😊 Joyeux</option>
            <option value="triste">😢 Triste</option>
            <option value="enerve">😡 Énervé</option>
            <option value="calme">😌 Calme</option>
        </select>
        <button onclick="join()">Rejoindre</button>
    </div>

    <div id="chat">
        <div class="status" id="status"></div>
        <div id="messages"></div>
        <input id="msg" placeholder="Message">
        <button onclick="send()">Envoyer</button>
    </div>
</div>

<script>
    const socket = io();
    const statusDiv = document.getElementById("status");
    const messagesDiv = document.getElementById("messages");

    function join() {
        const username = document.getElementById("username").value;
        const emotion = document.getElementById("emotion").value;

        socket.emit("join", { username, emotion });

        document.getElementById("login").style.display = "none";
        document.getElementById("chat").style.display = "block";
    }

    function send() {
        const msg = document.getElementById("msg").value;
        if (msg.trim() !== "") {
            socket.emit("message", { message: msg });
            messagesDiv.innerHTML += `<div><b>Moi :</b> ${msg}</div>`;
            document.getElementById("msg").value = "";
        }
    }

    socket.on("message", data => {
        messagesDiv.innerHTML += `<div><b>${data.from} :</b> ${data.message}</div>`;
    });

    socket.on("status", msg => {
        statusDiv.innerText = msg;
    });
</script>

</body>
</html>
