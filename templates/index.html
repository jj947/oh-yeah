<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Oh Yeah</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141E30, #243B55);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 380px;
    background: rgba(0,0,0,0.35);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

#global {
    text-align: center;
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 15px;
}

input, select, button {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    background: linear-gradient(135deg, #ff512f, #dd2476);
    color: white;
    cursor: pointer;
}

#chat {
    display: none;
}

#status {
    text-align: center;
    font-size: 14px;
    margin: 10px 0;
    opacity: 0.9;
}

#messages {
    height: 220px;
    overflow-y: auto;
    background: rgba(255,255,255,0.08);
    padding: 10px;
    border-radius: 10px;
}

.msg {
    margin-bottom: 6px;
}

#sendBox {
    display: flex;
    gap: 6px;
    margin-top: 10px;
}

#sendBox input {
    flex: 1;
}

#sendBox button {
    width: 90px;
}

.return {
    margin-top: 12px;
    background: rgba(255,255,255,0.15);
}
</style>
</head>

<body>
<div id="app">

<h1>Oh Yeah</h1>
<div id="global">👥 En attente : 0</div>

<div id="menu">
    <input id="username" placeholder="Ton pseudo">
    <select id="emotion">
        <option value="">Choisis une émotion</option>
        <option value="heureux" id="count-heureux" data-base="😊 Heureux">😊 Heureux</option>
        <option value="triste" id="count-triste" data-base="😢 Triste">😢 Triste</option>
        <option value="enerve" id="count-enerve" data-base="😡 Énervé">😡 Énervé</option>
        <option value="calme" id="count-calme" data-base="😌 Calme">😌 Calme</option>
        <option value="amour" id="count-amour" data-base="❤️ Amour">❤️ Amour</option>
    </select>
    <button onclick="join()">Rejoindre</button>
</div>

<div id="chat">
    <div id="status"></div>
    <div id="messages"></div>

    <div id="sendBox">
        <input id="msg" placeholder="Écris ton message">
        <button onclick="send()">Envoyer</button>
    </div>

    <button class="return" onclick="leave()">⬅ Retour au salon</button>
</div>

</div>

<script>
const socket = io();

function join() {
    if (!username.value || !emotion.value) return;
    socket.emit("join", {
        username: username.value,
        emotion: emotion.value
    });
    menu.style.display = "none";
    chat.style.display = "block";
}

function send() {
    if (!msg.value.trim()) return;
    socket.emit("send_message", { message: msg.value });
    msg.value = "";
}

function leave() {
    socket.emit("leave");
    chat.style.display = "none";
    menu.style.display = "block";
    messages.innerHTML = "";
}

socket.on("status", s => {
    status.textContent = s;
});

socket.on("message", data => {
    const d = document.createElement("div");
    d.className = "msg";
    d.innerHTML = `<b>${data.from}</b> : ${data.message}`;
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
});

socket.on("emotion_counts", counts => {
    for (const emo in counts) {
        const el = document.getElementById("count-" + emo);
        if (el) el.textContent = `${el.dataset.base} (${counts[emo]})`;
    }
});

socket.on("global_count", n => {
    global.textContent = `👥 En attente : ${n}`;
});
</script>

</body>
</html>
