<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oh Yeah</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        #chat {
            width: 350px;
        }
        #messages {
            border: 1px solid #444;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background: #000;
        }
        .me {
            color: #4caf50;
        }
        .system {
            color: #ff5252;
            font-style: italic;
        }
    </style>
</head>
<body>

<div id="chat">
    <h2>Oh Yeah</h2>

    <input id="pseudo" placeholder="Ton pseudo">
    <button onclick="join()">Entrer</button>

    <div id="messages"></div>

    <input id="input" placeholder="Message">
    <button onclick="send()">Envoyer</button>
</div>

<script>
    const socket = io();
    let myPseudo = "";

    function join() {
        myPseudo = document.getElementById("pseudo").value;
        socket.emit("join", { pseudo: myPseudo });
    }

    function send() {
        const input = document.getElementById("input");
        const msg = input.value;
        if (!msg) return;

        socket.emit("message", { text: msg });
        input.value = "";
    }

    socket.on("message", data => {
        const div = document.createElement("div");
        div.textContent = data.pseudo + " : " + data.text;
        if (data.pseudo === myPseudo) div.classList.add("me");
        document.getElementById("messages").appendChild(div);
    });

    socket.on("system", msg => {
        const div = document.createElement("div");
        div.textContent = msg;
        div.classList.add("system");
        document.getElementById("messages").appendChild(div);
    });
</script>

</body>
</html>
