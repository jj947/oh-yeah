<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Oh Yeah</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

.chat-input textarea {
  flex: 1;
  resize: none;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 1em;
  min-height: 48px;
  max-height: 140px;
  overflow-y: auto;
}

/* RESET */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
}

/* BACKGROUND */
body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #1f2933, #0b0f14);
  color: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* CARD */
.card {
  width: 100%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* TITRE */
h1 {
  text-align: center;
  margin-bottom: 10px;
  font-size: 2.2em;
}

.subtitle {
  text-align: center;
  font-size: 0.9em;
  color: #9ca3af;
  margin-bottom: 20px;
}

/* COUNTER */
.counter {
  text-align: center;
  margin-bottom: 20px;
  font-size: 0.95em;
  color: #a5b4fc;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 1em;
}

input::placeholder {
  color: #9ca3af;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(99,102,241,0.4);
}

.secondary {
  margin-top: 10px;
  background: rgba(255,255,255,0.1);
}

/* CHAT */
#chat {
  display: none;
}

#status {
  text-align: center;
  margin-bottom: 10px;
  font-size: 0.95em;
  color: #a5b4fc;
}

#messages {
  height: 260px;
  overflow-y: auto;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 10px;
}

/* MESSAGES */
.message {
  margin-bottom: 8px;
  font-size: 0.95em;
}

.message.me {
  text-align: right;
  color: #c7d2fe;
}

.message.other b {
  color: #a78bfa;
}

/* INPUT CHAT */
.chat-input {
  display: flex;
  gap: 8px;
}

.chat-input input {
  flex: 1;
  margin-bottom: 0;
}

/* SCROLLBAR */
#messages::-webkit-scrollbar {
  width: 6px;
}
#messages::-webkit-scrollbar-thumb {
  background: #4f46e5;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="card">

  <div id="menu">
    <h1>Oh Yeah</h1>
    <p class="subtitle">Parle anonymement avec quelqu’un qui ressent la même chose</p>

    <div class="counter">
      👥 <span id="counter">0</span> personnes en ligne
    </div>

    <input id="username" placeholder="Ton pseudo">

    <select id="emotion">
      <option value="heureux">😊 Heureux</option>
      <option value="triste">😢 Triste</option>
      <option value="colere">😡 En colère</option>
      <option value="calme">😌 Calme</option>
    </select>

    <button onclick="join()">Rejoindre une discussion</button>
  </div>

  <div id="chat">
    <p id="status"></p>

    <div id="messages"></div>

    <div class="chat-input">
      <textarea id="msg" placeholder="Écris ton message…" rows="2"></textarea>
      <button onclick="send()">➤</button>
    </div>


    <button class="secondary" onclick="location.reload()">Retour au menu</button>
  </div>

</div>

<script>
const socket = io();

const menu = document.getElementById("menu");
const chat = document.getElementById("chat");
const status = document.getElementById("status");
const messages = document.getElementById("messages");

socket.on("counter", n => {
  document.getElementById("counter").innerText = n;
});

socket.on("status", txt => {
  status.innerText = txt;
});

socket.on("message", data => {
  messages.innerHTML += `
    <div class="message other">
      <b>${data.from}</b> : ${data.message}
    </div>`;
  messages.scrollTop = messages.scrollHeight;
});

function join() {
  socket.emit("join", {
    username: document.getElementById("username").value,
    emotion: document.getElementById("emotion").value
  });

  menu.style.display = "none";
  chat.style.display = "block";
}

function send() {
  const input = document.getElementById("msg");
  if (!input.value) return;

  socket.emit("message", { message: input.value });

  messages.innerHTML += `
    <div class="message me">
      Moi : ${input.value}
    </div>`;
  messages.scrollTop = messages.scrollHeight;

  input.value = "";
}

const textarea = document.getElementById("msg");

textarea.addEventListener("input", () => {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";
});

textarea.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

</script>

</body>
</html>
