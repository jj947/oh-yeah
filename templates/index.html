<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chat par émotion</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    background: white;
    width: 420px;
    height: 620px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ---------- HEADER ---------- */
header {
    padding: 15px;
    background: #6c5ce7;
    color: white;
    text-align: center;
}

#globalCounter {
    font-size: 14px;
    opacity: 0.9;
}

/* ---------- MENU ---------- */
#menu {
    padding: 20px;
    flex: 1;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 15px;
}

button {
    background: #6c5ce7;
    color: white;
    cursor: pointer;
    border: none;
}

button:hover {
    background: #5a4bdc;
}

/* ---------- CHAT ---------- */
#chat {
    display: none;
    flex-direction: column;
    height: 100%;
}

#status {
    text-align: center;
    padding: 8px;
    font-size: 14px;
    background: #f1f1f1;
}

#messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #fafafa;
}

.message {
    margin-bottom: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    background: #e0e0ff;
    font-size: 14px;
}

/* ---------- INPUT BAR ---------- */
#inputBar {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
    background: white;
}

#msgInput {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

#sendBtn {
    width: 70px;
    margin-left: 8px;
    border-radius: 20px;
}

/* ---------- FOOTER ---------- */
#backBtn {
    background: #ff7675;
    margin: 10px;
}
</style>
</head>

<body>
<div id="app">
    <header>
        <h2>Chat par émotion</h2>
        <div id="globalCounter">0 utilisateurs en ligne</div>
    </header>

    <!-- MENU -->
    <div id="menu">
        <input id="username" placeholder="Ton pseudo">

        <select id="emotion">
            <option value="">Choisis une émotion</option>
            <option value="heureux">😊 Heureux (0)</option>
            <option value="triste">😢 Triste (0)</option>
            <option value="enerve">😡 Énervé (0)</option>
            <option value="calme">😌 Calme (0)</option>
            <option value="amour">❤️ Amour (0)</option>
        </select>

        <button onclick="join()">Entrer dans le chat</button>
    </div>

    <!-- CHAT -->
    <div id="chat">
        <div id="status"></div>
        <div id="messages"></div>

        <div id="inputBar">
            <input id="msgInput" placeholder="Écris ton message...">
            <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
        </div>

        <button id="backBtn" onclick="leaveChat()">Retour au menu</button>
    </div>
</div>

<script>
const socket = io();

function join() {
    const username = document.getElementById("username").value;
    const emotion = document.getElementById("emotion").value;

    if (!username || !emotion) return alert("Pseudo et émotion requis");

    socket.emit("join", { username, emotion });

    document.getElementById("menu").style.display = "none";
    document.getElementById("chat").style.display = "flex";
}

function sendMessage() {
    const input = document.getElementById("msgInput");
    if (input.value.trim() !== "") {
        socket.emit("message", { message: input.value });
        input.value = "";
    }
}

function leaveChat() {
    socket.emit("leave_chat");
    document.getElementById("chat").style.display = "none";
    document.getElementById("menu").style.display = "block";
    document.getElementById("messages").innerHTML = "";
}

socket.on("message", data => {
    const div = document.createElement("div");
    div.className = "message";
    div.innerText = `${data.from} : ${data.message}`;
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop =
        document.getElementById("messages").scrollHeight;
});

socket.on("status", msg => {
    document.getElementById("status").innerText = msg;
});

socket.on("update_counters", data => {
    document.getElementById("globalCounter").innerText =
        data.global + " utilisateurs en ligne";

    const select = document.getElementById("emotion");
    [...select.options].forEach(opt => {
        if (opt.value && data.emotions[opt.value] !== undefined) {
            opt.textContent =
                opt.textContent.split("(")[0].trim() +
                " (" + data.emotions[opt.value] + ")";
        }
    });
});
</script>
</body>
</html>
