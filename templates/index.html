<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Oh Yeah</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    height: 100vh;
}

.back-menu-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;

    padding: 12px 18px;
    border-radius: 12px;
    border: none;

    background: linear-gradient(135deg, #1f2937, #111827);
    color: white;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.back-menu-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 15px 40px rgba(37,99,235,0.35);
}

.back-menu-btn:active {
    transform: scale(0.97);
}

.app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    background: #020617;
}

header {
    padding: 15px;
    text-align: center;
    background: #020617;
    border-bottom: 1px solid #1e293b;
}

.counter {
    font-size: 0.85em;
    color: #94a3b8;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.msg {
    margin-bottom: 8px;
}

.me {
    text-align: right;
    color: #38bdf8;
}

.other {
    text-align: left;
    color: #e5e7eb;
}

.system {
    text-align: center;
    color: #94a3b8;
    font-style: italic;
    margin: 10px 0;
}

.input-zone {
    display: flex;
    border-top: 1px solid #1e293b;
}

textarea {
    flex: 1;
    resize: none;
    padding: 10px;
    border: none;
    outline: none;
    background: #020617;
    color: white;
    height: 60px;
}

button {
    width: 80px;
    background: #38bdf8;
    border: none;
    color: black;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>
<!-- Bouton retour menu -->
<button id="backMenuBtn" class="back-menu-btn">
    ⬅ Retour au menu
</button>

<div class="app">

<header>
    <h2>Oh Yeah</h2>
    <div class="counter">
        👥 <span id="globalCount">0</span> en ligne
    </div>
</header>

<div id="messages"></div>

<div class="input-zone">
    <textarea id="messageInput" placeholder="Écris ton message..."></textarea>
    <button onclick="sendMessage()">Envoyer</button>
</div>

</div>

<script>
const socket = io();
const messages = document.getElementById("messages");

const username = prompt("Ton pseudo ?");
const emotion = prompt("Émotion ? (heureux / triste / enerve / calme)");

socket.emit("join", { username, emotion });

socket.on("global_count", (n) => {
    document.getElementById("globalCount").innerText = n;
});

socket.on("status", (text) => {
    const div = document.createElement("div");
    div.className = "system";
    div.innerText = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
});

socket.on("message", (data) => {
    const div = document.createElement("div");
    div.className = "msg " + (data.from === "me" ? "me" : "other");
    div.innerText = (data.from === "me" ? "Moi" : data.from) + " : " + data.message;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
});

function sendMessage() {
    const input = document.getElementById("messageInput");
    if (input.value.trim() === "") return;
    socket.emit("send_message", { message: input.value });
    input.value = "";
}
</script>

</body>
</html>
