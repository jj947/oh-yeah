<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Oh Yeah</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
}

.hidden { display: none; }

h1 {
    text-align: center;
}

.counter {
    text-align: center;
    opacity: 0.7;
    margin-bottom: 10px;
}

select, input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    background: #6366f1;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4f46e5;
}

.chat {
    display: flex;
    flex-direction: column;
    height: 70vh;
}

.status {
    text-align: center;
    margin: 10px 0;
    opacity: 0.8;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: #020617;
    border-radius: 8px;
}

.msg {
    margin-bottom: 8px;
}

.self {
    text-align: right;
    color: #a5b4fc;
}

.other {
    text-align: left;
    color: #e5e7eb;
}

.input-zone {
    display: flex;
    margin-top: 10px;
}

.input-zone input {
    flex: 1;
    padding: 12px;
    border-radius: 8px 0 0 8px;
}

.input-zone button {
    width: 80px;
    border-radius: 0 8px 8px 0;
}
</style>
</head>

<body>
<div class="container">

<div id="menu">
    <h1>Oh Yeah</h1>
    <div class="global-counter">
    👥 <span id="globalCount">0</span> utilisateurs en ligne
</div>

    <input id="username" placeholder="Ton pseudo">

    <select id="emotion">
        <option value="">Choisis une émotion</option>
        <option value="heureux">😊 Heureux</option>
        <option value="triste">😢 Triste</option>
        <option value="enerve">😡 Énervé</option>
        <option value="calme">😌 Calme</option>
        <option value="amour">❤️ Amour</option>
    </select>

    <button onclick="join()">Entrer</button>
</div>

<div id="chat" class="hidden chat">
    <div class="status" id="status"></div>

    <div class="messages" id="messages"></div>

    <div class="input-zone">
        <input id="message" placeholder="Écris ton message">
        <button onclick="send()">Envoyer</button>
    </div>

    <button onclick="leave()">⬅ Retour</button>
</div>

</div>

<script>
const socket = io();
    
socket.on("global_count", (count) => {
    document.getElementById("globalCount").innerText = count;
});

socket.on("status", txt => {
    document.getElementById("status").innerText = txt;
});

socket.on("message", data => {
    const div = document.createElement("div");
    div.className = "msg " + (data.self ? "self" : "other");
    div.innerText = data.from + " : " + data.text;

    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
});

function join() {
    const u = username.value.trim();
    const e = emotion.value;

    if (!u || !e) return alert("Remplis tout");

    socket.emit("join", { username: u, emotion: e });

    menu.classList.add("hidden");
    chat.classList.remove("hidden");
}

function send() {
    const m = message.value.trim();
    if (!m) return;

    socket.emit("send_message", { message: m });
    message.value = "";
}

function leave() {
    socket.emit("leave");
    location.reload();
}
</script>
</body>
</html>
