<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Oh Yeah</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
        }

        button {
            background: #00ff99;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #00cc77;
        }

        #messages {
            background: #222;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-top: 15px;
            border-radius: 5px;
        }

        .message {
            margin-bottom: 8px;
        }

        .system {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

<h1>Oh Yeah</h1>

<div class="container">

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login">
        <input type="text" id="pseudo" placeholder="Choisis un pseudo">
        
        <select id="emotion">
            <option value="">Choisis ton émotion</option>
            <option value="triste">😢 Triste</option>
            <option value="content">😊 Content</option>
            <option value="colere">😡 En colère</option>
            <option value="stresse">😰 Stressé</option>
        </select>

        <button onclick="join()">Rejoindre</button>
    </div>

    <!-- CHAT -->
    <div id="chat" class="hidden">
        <div id="messages"></div>

        <input type="text" id="messageInput" placeholder="Écris ton message">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

</div>

<script>
    const socket = io();

    const loginDiv = document.getElementById("login");
    const chatDiv = document.getElementById("chat");
    const messagesDiv = document.getElementById("messages");

    function join() {
        const pseudo = document.getElementById("pseudo").value.trim();
        const emotion = document.getElementById("emotion").value;

        if (!pseudo || !emotion) {
            alert("Pseudo et émotion obligatoires");
            return;
        }

        socket.emit("join", {
            pseudo: pseudo,
            emotion: emotion
        });

        loginDiv.classList.add("hidden");
        chatDiv.classList.remove("hidden");
    }

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();

        if (!text) return;

        socket.emit("message", {
            text: text
        });

        input.value = "";
    }

    socket.on("message", (msg) => {
        const div = document.createElement("div");
        div.className = "message";

        if (msg.startsWith("🟢")) {
            div.classList.add("system");
        }

        div.textContent = msg;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
</script>

</body>
</html>
