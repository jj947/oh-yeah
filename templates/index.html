<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Oh Yeah</title>
  <div id="status" style="color:#e53e3e; text-align:center; margin-bottom:5px;"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 95%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #5a67d8;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    #login, #chat {
      padding: 15px;
      display: none;
      flex-direction: column;
      height: 100%;
    }

    input, select, button {
      padding: 10px;
      margin: 6px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #5a67d8;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #434190;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .message {
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 12px;
      max-width: 80%;
      animation: fadeIn 0.25s ease;
      word-wrap: break-word;
    }

    .me {
      background: #d1fae5;
      align-self: flex-end;
    }

    .other {
      background: #edf2f7;
      align-self: flex-start;
    }

    #typing {
      font-style: italic;
      font-size: 13px;
      color: #666;
      display: none;
      margin-bottom: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div id="app">
  <header>Oh Yeah</header>

  <!-- LOGIN -->
  <div id="login">
    <input id="pseudo" placeholder="Choisis un pseudo">
    <select id="emotion">
      <option value="">Choisis ton émotion</option>
      <option value="triste">😢 Triste</option>
      <option value="heureux">😊 Heureux</option>
      <option value="colere">😡 En colère</option>
      <option value="neutre">😐 Neutre</option>
    </select>
    <button onclick="join()">Rejoindre</button>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div id="messages"></div>
    <div id="typing">Quelqu’un est en train d’écrire…</div>

    <input id="message" placeholder="Écris un message…">
    <button onclick="sendMessage()">Envoyer</button>
  </div>
</div>

<script>
  const socket = io();
  let pseudo = "";
  let typingTimeout;

  document.getElementById("login").style.display = "flex";

  function join() {
    pseudo = document.getElementById("pseudo").value;
    const emotion = document.getElementById("emotion").value;

    if (!pseudo || !emotion) {
      alert("Choisis un pseudo et une émotion");
      return;
    }

    socket.emit("join", { pseudo, emotion });

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
  }

  function sendMessage() {
    const input = document.getElementById("message");
    if (input.value.trim() === "") return;

    socket.emit("message", input.value);
    addMessage("Moi", input.value, true);
    input.value = "";
    socket.emit("typing", false);
  }

  function addMessage(author, text, me=false) {
    const div = document.createElement("div");
    div.classList.add("message");
    div.classList.add(me ? "me" : "other");
    div.innerHTML = `<strong>${author} :</strong> ${text}`;
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop = 999999;
  }

  socket.on("message", data => {
    addMessage(data.pseudo, data.message);
  });

  const input = document.getElementById("message");
  input.addEventListener("input", () => {
    socket.emit("typing", true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      socket.emit("typing", false);
    }, 1000);
  });

  socket.on("typing", status => {
    document.getElementById("typing").style.display = status ? "block" : "none";
  });
  
  socket.on("status", msg => {
  document.getElementById("status").innerText = msg;
});

socket.on("connected", () => {
  document.getElementById("status").innerText = "";
});

</script>

</body>
</html>
