<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Oh Yeah</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }
    #messages {
      width: 90%;
      max-width: 400px;
      height: 300px;
      border: 1px solid #444;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    input, button, select {
      width: 90%;
      max-width: 400px;
      margin: 5px 0;
      padding: 8px;
    }
    #status {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>Oh Yeah</h1>
  <div id="status">Connexion…</div>

  <select id="emotion">
    <option value="">Choisis ton émotion</option>
    <option value="heureux">😊 Heureux</option>
    <option value="triste">😢 Triste</option>
    <option value="enerve">😡 Énervé</option>
    <option value="stress">😰 Stressé</option>
  </select>

  <div id="messages"></div>

  <input id="message" placeholder="Ton message…" />
  <button onclick="sendMessage()">Envoyer</button>

  <script>
    const socket = io();

    const status = document.getElementById("status");
    const messagesDiv = document.getElementById("messages");

    socket.on("connect", () => {
      status.innerHTML = "🟢 Connecté";
      status.style.color = "lime";
    });

    socket.on("disconnect", () => {
      status.innerHTML = "🔴 Déconnecté";
      status.style.color = "red";
    });

    socket.on("message", (data) => {
      const p = document.createElement("p");
      p.textContent = data;
      messagesDiv.appendChild(p);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    function sendMessage() {
      const msgInput = document.getElementById("message");
      const emotion = document.getElementById("emotion").value;

      if (!emotion) {
        alert("Choisis une émotion !");
        return;
      }

      if (msgInput.value.trim() === "") return;

      socket.emit("message", {
        emotion: emotion,
        text: msgInput.value
      });

      msgInput.value = "";
    }
  </script>

</body>
</html>
