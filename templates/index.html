<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Oh Yeah</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

#chat { display: none; }

#messages {
  height: 250px;
  overflow-y: auto;
  border: 1px solid #444;
  padding: 10px;
  margin-bottom: 10px;
}

button {
  padding: 8px 12px;
  margin: 5px;
}
</style>
</head>

<body>

<h1>Oh Yeah</h1>
<p>👥 En ligne : <span id="counter">0</span></p>

<div id="menu">
  <input id="username" placeholder="Pseudo"><br><br>
  <select id="emotion">
    <option value="heureux">😊 Heureux</option>
    <option value="triste">😢 Triste</option>
    <option value="colere">😡 Colère</option>
    <option value="calme">😌 Calme</option>
  </select><br><br>
  <button onclick="join()">Rejoindre</button>
</div>

<div id="chat">
  <p id="status"></p>

  <div id="messages"></div>

  <input id="msg" placeholder="Message">
  <button onclick="send()">Envoyer</button><br><br>
  <button onclick="location.reload()">Retour au menu</button>
</div>

<script>
const socket = io();

const menu = document.getElementById("menu");
const chat = document.getElementById("chat");
const status = document.getElementById("status");
const messages = document.getElementById("messages");

socket.on("counter", n => {
  document.getElementById("counter").innerText = n;
});

socket.on("status", txt => {
  status.innerText = txt;
});

socket.on("message", data => {
  messages.innerHTML += `<p><b>${data.from}</b> : ${data.message}</p>`;
});

function join() {
  socket.emit("join", {
    username: document.getElementById("username").value,
    emotion: document.getElementById("emotion").value
  });

  menu.style.display = "none";
  chat.style.display = "block";
}

function send() {
  const input = document.getElementById("msg");
  socket.emit("message", { message: input.value });
  messages.innerHTML += `<p><i>Moi :</i> ${input.value}</p>`;
  input.value = "";
}
</script>

</body>
</html>
