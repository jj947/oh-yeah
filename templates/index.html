<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OhYeah Chat</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== TOP BAR ===== */
.topbar {
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:10px 20px;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}

.counter {
    font-weight:bold;
}

.settings-btn {
    cursor:pointer;
}

/* ===== CARD ===== */
.card {
    width:380px;
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* ===== INPUTS ===== */
input, select, button {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    border:none;
}

button {
    background:#22c55e;
    cursor:pointer;
    font-weight:bold;
}

/* ===== CHAT ===== */
#chat { display:none; }

#messages {
    height:260px;
    overflow-y:auto;
    background:rgba(0,0,0,0.3);
    padding:10px;
    border-radius:10px;
}

.msg {
    margin:6px 0;
}

.me {
    color:#22c55e;
}

.status {
    text-align:center;
    font-style:italic;
    opacity:0.8;
}

/* ===== SETTINGS MODAL ===== */
.modal {
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:#111827;
    padding:20px;
    border-radius:10px;
    width:300px;
}

</style>
</head>

<body>

<div class="topbar">
    <div class="counter" id="counter">0 connectés</div>
    <div class="settings-btn" onclick="openSettings()">⚙️</div>
</div>

<div class="card">

<!-- MENU -->
<div id="menu">
    <h2>OhYeah 💬</h2>

    <input id="username" placeholder="Pseudo">

    <select id="emotion">
        <option value="">Émotion</option>
        <option value="heureux">😊 heureux</option>
        <option value="triste">😢 triste</option>
        <option value="enerve">😡 énervé</option>
        <option value="calme">😌 calme</option>
        <option value="amour">❤️ amour</option>
    </select>

    <button onclick="join()">Rejoindre</button>
</div>

<!-- CHAT -->
<div id="chat">
    <div id="status">en attente d'un partenaire</div>

    <div id="messages"></div>

    <input id="msg" placeholder="message...">
    <button onclick="send()">envoyer</button>
</div>

</div>

<!-- SETTINGS -->
<div class="modal" id="settings">
  <div class="modal-content">
    <h3>Paramètres</h3>

    <label>
        <input type="checkbox" id="dark"> Dark mode
    </label>

    <label>
        <input type="checkbox" id="sound"> Sons
    </label>

    <button onclick="closeSettings()">Fermer</button>
  </div>
</div>

<script>

const socket = io(window.location.origin, {
    transports: ["websocket", "polling"]
});
let username = "";
let emotion = "";

/* ===== JOIN ===== */
function join() {
    username = document.getElementById("username").value;
    emotion = document.getElementById("emotion").value;

    if(!username || !emotion) return alert("complète tout");

    socket.emit("join", {username, emotion});

    document.getElementById("menu").style.display="none";
    document.getElementById("chat").style.display="block";
}

/* ===== SEND ===== */
function send() {
    let m = document.getElementById("msg").value;
    if(!m) return;

    socket.emit("message",{message:m});
    add(username, m, true);

    document.getElementById("msg").value="";
}

/* ===== UI MSG ===== */
function add(user,msg,me=false){
    let div=document.createElement("div");
    div.className="msg";
    div.innerHTML=`<b class="${me?'me':''}">${user} (${emotion})</b> : ${msg}`;
    document.getElementById("messages").appendChild(div);
}

/* ===== STATUS ===== */
socket.on("status", (t)=>{
    document.getElementById("status").innerText=t;
});

/* ===== MSG ===== */
socket.on("message",(d)=>{
    add(d.from, d.message);
});

/* ===== COUNT ===== */
socket.on("count",(n)=>{
    document.getElementById("counter").innerText=n+" connectés";
});

/* ===== SETTINGS ===== */
function openSettings(){
    document.getElementById("settings").style.display="flex";
}
function closeSettings(){
    document.getElementById("settings").style.display="none";
}

</script>

</body>
</html>
