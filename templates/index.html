<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Oh Yeah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #container {
      background: #020617;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
    }

    #status {
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #messages {
      height: 200px;
      overflow-y: auto;
      border: 1px solid #334155;
      padding: 10px;
      margin-bottom: 10px;
      background: #020617;
    }

    .msg {
      margin-bottom: 5px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }

    input {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #334155;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:active {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div id="container">
    <h1>Oh Yeah 💬</h1>
    <div id="status">Connexion…</div>

    <div id="messages"></div>

    <input id="messageInput" placeholder="Ton message..." />
    <button onclick="sendMessage()">Envoyer</button>
  </div>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    const statusDiv = document.getElementById("status");
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("messageInput");

    const socket = io({
      path: "/socket.io",
      transports: ["polling"],   // ← IMPORTANT pour mobile
      secure: true
    });

    socket.on("connect", () => {
      statusDiv.textContent = "Connecté ✅";
      statusDiv.style.color = "#22c55e";
    });

    socket.on("connect_error", (err) => {
      statusDiv.textContent = "Erreur de connexion ❌";
      statusDiv.style.color = "#ef4444";
      console.log(err);
    });

    socket.on("message", (msg) => {
      const div = document.createElement("div");
      div.className = "msg";
      div.textContent = msg;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    function sendMessage() {
      const msg = input.value.trim();
      if (msg === "") return;

      socket.send(msg);
      input.value = "";
    }

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
